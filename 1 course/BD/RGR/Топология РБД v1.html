<!DOCTYPE html>
<html>
<head>
    <title>Архитектура системы обезличивания</title>
    <style>
        canvas {
            border: 1px solid #ddd;
            display: block;
            margin: 0 auto;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <canvas id="diagramCanvas" width="800" height="700"></canvas>

    <script>
        const canvas = document.getElementById('diagramCanvas');
        const ctx = canvas.getContext('2d');
        
        // Функция для рисования закругленного прямоугольника
        function roundedRect(x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }
        
        // Функция для рисования облака
        function drawCloud(x, y, width, height) {
            const segments = 8;
            const segmentAngle = (Math.PI * 2) / segments;
            const radius = height / 2;
            
            ctx.beginPath();
            for (let i = 0; i < segments; i++) {
                const angle = segmentAngle * i;
                const nextAngle = segmentAngle * (i + 1);
                
                // Смещение для волнистости
                const offset = (i % 2 === 0) ? radius * 0.9 : radius * 1.1;
                
                const x1 = x + width/2 + Math.cos(angle) * offset;
                const y1 = y + height/2 + Math.sin(angle) * offset;
                const x2 = x + width/2 + Math.cos(nextAngle) * offset;
                const y2 = y + height/2 + Math.sin(nextAngle) * offset;
                
                if (i === 0) {
                    ctx.moveTo(x1, y1);
                }
                
                // Кривая Безье для плавных переходов
                const cx = x + width/2 + Math.cos(angle + segmentAngle/2) * offset * 1.2;
                const cy = y + height/2 + Math.sin(angle + segmentAngle/2) * offset * 1.2;
                
                ctx.quadraticCurveTo(cx, cy, x2, y2);
            }
            ctx.closePath();
            
            // Градиент для облака
            const gradient = ctx.createRadialGradient(
                x + width/2, y + height/2, 0,
                x + width/2, y + height/2, radius * 1.5
            );
            gradient.addColorStop(0, '#e6f3ff');
            gradient.addColorStop(1, '#b8d9ff');
            
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.strokeStyle = '#5a9bd5';
            ctx.stroke();
        }
        
        // Функция для рисования шестеренки
        function drawGear(x, y, size, teeth) {
            const outerRadius = size / 2;
            const innerRadius = outerRadius * 0.6;
            const toothDepth = outerRadius * 0.2;
            
            ctx.beginPath();
            
            // Рисуем зубья шестеренки
            for (let i = 0; i < teeth; i++) {
                const angle = (i * 2 * Math.PI) / teeth;
                const nextAngle = ((i + 0.5) * 2 * Math.PI) / teeth;
                
                // Внешняя точка зуба
                const x1 = x + Math.cos(angle) * outerRadius;
                const y1 = y + Math.sin(angle) * outerRadius;
                
                // Внутренняя точка между зубьями
                const x2 = x + Math.cos(nextAngle) * (outerRadius - toothDepth);
                const y2 = y + Math.sin(nextAngle) * (outerRadius - toothDepth);
                
                if (i === 0) {
                    ctx.moveTo(x1, y1);
                } else {
                    ctx.lineTo(x1, y1);
                }
                
                ctx.lineTo(x2, y2);
            }
            
            ctx.closePath();
            ctx.fillStyle = '#5a5a5a';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.stroke();
            
            // Центральный круг
            ctx.beginPath();
            ctx.arc(x, y, innerRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.stroke();
            
            // Линии в центре
            ctx.beginPath();
            ctx.moveTo(x - innerRadius * 0.7, y);
            ctx.lineTo(x + innerRadius * 0.7, y);
            ctx.moveTo(x, y - innerRadius * 0.7);
            ctx.lineTo(x, y + innerRadius * 0.7);
            ctx.strokeStyle = '#333';
            ctx.stroke();
        }
        
        // Функция для рисования базы данных
        function drawDatabase(x, y, width, height) {
            // Основание
            ctx.beginPath();
            ctx.ellipse(x + width/2, y + height, width/2, height/8, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#e1f5fe';
            ctx.fill();
            ctx.strokeStyle = '#0288d1';
            ctx.stroke();
            
            // Тело
            ctx.beginPath();
            ctx.moveTo(x, y + height);
            ctx.lineTo(x, y + height/4);
            ctx.ellipse(x + width/2, y + height/4, width/2, height/4, 0, Math.PI, 0, true);
            ctx.lineTo(x + width, y + height);
            ctx.closePath();
            ctx.fillStyle = '#b3e5fc';
            ctx.fill();
            ctx.strokeStyle = '#0288d1';
            ctx.stroke();
            
            // Верхняя часть
            ctx.beginPath();
            ctx.ellipse(x + width/2, y, width/2, height/4, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#4fc3f7';
            ctx.fill();
            ctx.strokeStyle = '#0288d1';
            ctx.stroke();
            
            // Ключ (упрощенный)
            ctx.beginPath();
            ctx.moveTo(x + width/2 - 5, y + height/3);
            ctx.lineTo(x + width/2 + 5, y + height/3);
            ctx.moveTo(x + width/2, y + height/3);
            ctx.lineTo(x + width/2, y + height/2);
            ctx.arc(x + width/2, y + height/2 + 5, 5, -Math.PI/2, Math.PI/2);
            ctx.strokeStyle = '#ff9800';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.lineWidth = 1;
        }
        
        // Функция для рисования блокчейна
        function drawBlockchain(x, y, blockCount, blockWidth, blockHeight) {
            const gap = 5;
            const totalWidth = blockCount * blockWidth + (blockCount - 1) * gap;
            const startX = x - totalWidth / 2;
            
            for (let i = 0; i < blockCount; i++) {
                const blockX = startX + i * (blockWidth + gap);
                
                // Блок
                ctx.fillStyle = i % 2 === 0 ? '#e8f5e9' : '#c8e6c9';
                ctx.fillRect(blockX, y, blockWidth, blockHeight);
                ctx.strokeRect(blockX, y, blockWidth, blockHeight);
                
                // Текст в блоке
                ctx.fillStyle = '#2e7d32';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`Block ${i+1}`, blockX + blockWidth/2, y + blockHeight/2 + 3);
                
                // Соединительная линия (кроме последнего блока)
                if (i < blockCount - 1) {
                    ctx.beginPath();
                    ctx.moveTo(blockX + blockWidth, y + blockHeight/2);
                    ctx.lineTo(blockX + blockWidth + gap, y + blockHeight/2);
                    ctx.strokeStyle = '#2e7d32';
                    ctx.stroke();
                }
            }
        }
        
        // Функция для рисования фильтра
        function drawFilter(x, y, size) {
            // Основная часть
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + size, y);
            ctx.lineTo(x + size * 0.7, y + size);
            ctx.lineTo(x + size * 0.3, y + size);
            ctx.closePath();
            ctx.fillStyle = '#bbdefb';
            ctx.fill();
            ctx.strokeStyle = '#2196f3';
            ctx.stroke();
            
            // Линии фильтра
            ctx.beginPath();
            for (let i = 0; i < 3; i++) {
                const offset = size * 0.1 + i * size * 0.2;
                ctx.moveTo(x + offset, y + size * 0.2);
                ctx.lineTo(x + offset + size * 0.2, y + size * 0.8);
            }
            ctx.strokeStyle = '#2196f3';
            ctx.stroke();
        }
        
        // Функция для рисования маски
        function drawMask(x, y, size) {
            // Основная часть
            ctx.beginPath();
            ctx.ellipse(x, y, size * 0.4, size * 0.3, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#e1f5fe';
            ctx.fill();
            ctx.strokeStyle = '#0288d1';
            ctx.stroke();
            
            // Глаза
            ctx.beginPath();
            ctx.ellipse(x - size * 0.15, y - size * 0.05, size * 0.08, size * 0.06, 0, 0, Math.PI * 2);
            ctx.ellipse(x + size * 0.15, y - size * 0.05, size * 0.08, size * 0.06, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#01579b';
            ctx.fill();
            
            // Резинки
            ctx.beginPath();
            ctx.moveTo(x - size * 0.4, y);
            ctx.lineTo(x - size * 0.5, y - size * 0.1);
            ctx.lineTo(x - size * 0.5, y + size * 0.1);
            ctx.closePath();
            ctx.moveTo(x + size * 0.4, y);
            ctx.lineTo(x + size * 0.5, y - size * 0.1);
            ctx.lineTo(x + size * 0.5, y + size * 0.1);
            ctx.closePath();
            ctx.fillStyle = '#b3e5fc';
            ctx.fill();
            ctx.strokeStyle = '#0288d1';
            ctx.stroke();
        }
        
        // Функция для рисования графика
        function drawChart(x, y, size) {
            // Оси
            ctx.beginPath();
            ctx.moveTo(x - size/2, y + size/2);
            ctx.lineTo(x - size/2, y - size/2);
            ctx.lineTo(x + size/2, y - size/2);
            ctx.strokeStyle = '#5c6bc0';
            ctx.stroke();
            
            // График
            ctx.beginPath();
            ctx.moveTo(x - size/2, y);
            ctx.lineTo(x - size/3, y - size/4);
            ctx.lineTo(x - size/6, y + size/6);
            ctx.lineTo(x, y - size/8);
            ctx.lineTo(x + size/6, y + size/4);
            ctx.lineTo(x + size/3, y - size/6);
            ctx.lineTo(x + size/2, y + size/8);
            ctx.strokeStyle = '#3949ab';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.lineWidth = 1;
        }
        
        // Функция для рисования лупы
        function drawMagnifier(x, y, size) {
            // Ручка
            ctx.beginPath();
            ctx.moveTo(x + size * 0.3, y + size * 0.3);
            ctx.lineTo(x + size * 0.6, y + size * 0.6);
            ctx.strokeStyle = '#5d4037';
            ctx.lineWidth = size * 0.1;
            ctx.stroke();
            ctx.lineWidth = 1;
            
            // Линза
            ctx.beginPath();
            ctx.arc(x, y, size * 0.4, 0, Math.PI * 2);
            ctx.fillStyle = '#e3f2fd';
            ctx.fill();
            ctx.strokeStyle = '#1976d2';
            ctx.stroke();
            
            // Увеличение
            ctx.beginPath();
            ctx.moveTo(x - size * 0.2, y - size * 0.1);
            ctx.lineTo(x - size * 0.1, y - size * 0.2);
            ctx.moveTo(x + size * 0.1, y + size * 0.2);
            ctx.lineTo(x + size * 0.2, y + size * 0.1);
            ctx.strokeStyle = '#0d47a1';
            ctx.stroke();
        }
        
        // Функция для рисования кэш-памяти
        function drawCache(x, y, size) {
            // Основной прямоугольник
            ctx.fillStyle = '#fff8e1';
            ctx.fillRect(x - size/2, y - size/2, size, size);
            ctx.strokeRect(x - size/2, y - size/2, size, size);
            
            // Линии данных
            ctx.beginPath();
            for (let i = 0; i < 4; i++) {
                const offset = -size/2 + i * size/3;
                ctx.moveTo(x - size/2, y + offset);
                ctx.lineTo(x + size/2, y + offset);
            }
            ctx.strokeStyle = '#ffa000';
            ctx.stroke();
            
            // Надпись
            ctx.fillStyle = '#ff6f00';
            ctx.font = 'bold 10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Cache', x, y);
        }
        
        // Функция для рисования соединительных линий
        function drawConnection(x1, y1, x2, y2, dashed = false) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            
            // Изгиб для лучшей визуализации
            const midY = (y1 + y2) / 2;
            ctx.bezierCurveTo(x1, midY, x2, midY, x2, y2);
            
            ctx.strokeStyle = '#666';
            if (dashed) {
                ctx.setLineDash([5, 3]);
            } else {
                ctx.setLineDash([]);
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }
        
        // Отрисовка всей диаграммы
        function drawDiagram() {
            // Центральное облако - Головной офис
            const centerX = canvas.width / 2;
            const centerY = 150;
            
            // Облако
            drawCloud(centerX - 180, centerY - 80, 360, 120);
            ctx.fillStyle = '#0d47a1';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Центр обезличивания', centerX, centerY - 50);
            
            // Элементы внутри облака
            // 1. Главный сервер управления политиками
            drawGear(centerX - 100, centerY - 20, 40);
            ctx.fillStyle = '#000';
            ctx.font = '10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Главный сервер', centerX - 100, centerY + 25);
            ctx.fillText('управления политиками', centerX - 100, centerY + 38);
            
            // 2. Мастер-база таблиц соответствия
            drawDatabase(centerX, centerY - 20, 50, 40);
            ctx.fillStyle = '#000';
            ctx.fillText('Мастер-база', centerX, centerY + 25);
            ctx.fillText('таблиц соответствия', centerX, centerY + 38);
            
            // 3. Блокчейн-регистратор операций
            drawBlockchain(centerX + 100, centerY - 10, 3, 40, 30);
            ctx.fillStyle = '#000';
            ctx.fillText('Блокчейн-', centerX + 100, centerY + 25);
            ctx.fillText('регистратор операций', centerX + 100, centerY + 38);
            
            // Региональные узлы
            const regionCount = 3;
            const regionWidth = 150;
            const regionHeight = 100;
            const regionY = centerY + 180;
            
            for (let i = 0; i < regionCount; i++) {
                const regionX = centerX + (i - (regionCount - 1)/2) * (regionWidth + 40);
                
                // Прямоугольник региона
                ctx.fillStyle = '#e3f2fd';
                roundedRect(regionX - regionWidth/2, regionY - regionHeight/2, regionWidth, regionHeight, 10);
                
                // Название региона
                ctx.fillStyle = '#1565c0';
                ctx.font = 'bold 12px Arial';
                ctx.fillText(`Регион ${i+1}`, regionX, regionY - 30);
                
                // Элементы внутри региона
                // Сервер предварительной обработки
                drawFilter(regionX - 40, regionY - 10, 20);
                
                // Специализированные модули обезличивания
                drawMask(regionX, regionY - 10, 20);
                ctx.beginPath();
                ctx.arc(regionX + 25, regionY - 5, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#ff9800';
                ctx.fill();
                ctx.strokeStyle = '#e65100';
                ctx.stroke();
                drawChart(regionX + 40, regionY - 10, 20);
                
                // Локальное хранилище
                drawDatabase(regionX - 10, regionY + 20, 30, 25);
                
                // Соединение с центральным облаком
                drawConnection(centerX, centerY + 60, regionX, regionY - 50);
            }
            
            // Филиальные узлы
            const branchCount = 10;
            const branchRadius = 20;
            const branchY = regionY + 180;
            const branchSpacing = (canvas.width - 100) / (branchCount - 1);
            
            for (let i = 0; i < branchCount; i++) {
                const branchX = 50 + i * branchSpacing;
                
                // Круг филиала
                ctx.beginPath();
                ctx.arc(branchX, branchY, branchRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#e8f5e9';
                ctx.fill();
                ctx.strokeStyle = '#2e7d32';
                ctx.stroke();
                
                // Название филиала
                ctx.fillStyle = '#1b5e20';
                ctx.font = '10px Arial';
                ctx.fillText(`Филиал ${i+1}`, branchX, branchY + branchRadius + 15);
                
                // Элементы внутри филиала
                // Модуль идентификации данных
                drawMagnifier(branchX - 8, branchY - 5, 15);
                
                // Кэш часто используемых данных
                drawCache(branchX + 8, branchY + 5, 15);
                
                // Соединение с региональным узлом (соединяем с ближайшим регионом)
                const regionIndex = Math.floor(i / (branchCount / regionCount));
                const regionX = centerX + (regionIndex - (regionCount - 1)/2) * (regionWidth + 40);
                drawConnection(regionX, regionY + 50, branchX, branchY - branchRadius, true);
            }
            
            // Легенда (опционально)
            ctx.fillStyle = '#333';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'left';
            ctx.fillText('Архитектура системы обезличивания данных', 20, 30);
        }
        
        // Запуск отрисовки
        drawDiagram();
    </script>
</body>
</html>
